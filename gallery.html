<!DOCTYPE html>
<html>
<head>
  <title>Food Gallery - Rahma Restaurant</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #e63946;
      color: white;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .grid img {
      width: 100%;
      border-radius: 10px;
      height: 150px;
      object-fit: cover;
    }

    .btn {
      display: inline-block;
      margin: 20px;
      padding: 10px 15px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>

</head>

<body>

<header>
  <h1>🍽️ Food Gallery</h1>
</header>

<div class="grid">

  <img src="IMG-20260509-WA0119.jpg">
  <img src="IMG-20260509-WA0119.jpg">
  <img src="IMG-20260509-WA0119.jpg">
  <img src="IMG-20260509-WA0119.jpg">

</div>

</body>
</html>
