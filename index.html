<!DOCTYPE html>
<html>
<head>
  <title>Rahma Restaurant</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }

    /* HEADER */
    .header {
      background: linear-gradient(90deg, #e63946, #ff6b6b);
      color: white;
      padding: 25px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 32px;
    }

    .header p {
      margin: 5px 0 0;
    }

    /* CONTAINER */
    .container {
      padding: 20px;
      text-align: center;
    }

    /* IMAGE */
    .food-img {
      width: 260px;
      border-radius: 15px;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* MENU CARD */
    .menu {
      background: white;
      width: 220px;
      margin: 10px auto;
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 18px;
    }

    /* BUTTON */
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #2a9d8f;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background: #21867a;
    }

    /* FOOTER */
    .footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 12px;
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
<style>
.btn {
  display: inline-block;
  padding: 12px 18px;
  margin: 8px;
  background: linear-gradient(90deg, #ff4d4d, #ff914d);
  color: white;
  text-decoration: none;
  border-radius: 25px;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>Rahma Restaurant</h1>
  <p>Delicious & Premium Meals</p>
</div>

<!-- CONTENT -->
<div class="container">

  <img class="food-img" src="./IMG-20260509-WA0119.jpg" alt="food">
  <a href="menu.html" class="btn">View Full Menu</a>
<a href="gallery.html" class="btn">View Food Gallery</a>
  <h2>Our Menu</h2>

  <div class="menu">🍚 Rice - ₦1,000</div>
  <div class="menu">🍗 Chicken - ₦1,500</div>
  <div class="menu">🍝 Spaghetti - ₦1,200</div>

  <a class="btn" href="https://wa.me/2349017273185?text=Hello%20I%20want%20to%20order%20food">
    Order on WhatsApp
  </a>

</div>

<!-- FOOTER -->
<div class="footer">
  © 2026 Rahma Restaurant | All Rights Reserved
</div>

</body>
</html>
